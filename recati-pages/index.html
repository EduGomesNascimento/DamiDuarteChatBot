<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RECA Componentes</title>
    <meta name="description" content="RECA Componentes — loja de componentes eletrônicos. Microcontroladores, sensores, resistores, CIs, ferramentas e muito mais." />

    <!-- ============================================================= -->
    <!--  TROQUE A URL ABAIXO pela URL da loja na Vercel               -->
    <!--  Ex.: https://reca-componentes.vercel.app  ou loja.recati.com.br -->
    <script>
      var LOJA = 'https://SUA-LOJA.vercel.app';
    </script>
    <!-- ============================================================= -->

    <!-- Redireciona automático (fallback se o JS estiver desativado) -->
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://SUA-LOJA.vercel.app" />
    </noscript>

    <style>
      :root { color-scheme: dark; }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100vh; display: grid; place-items: center;
        font-family: 'Segoe UI', system-ui, Arial, sans-serif;
        color: #F1F5F9; text-align: center; padding: 24px;
        background-color: #0D1320;
        background-image:
          linear-gradient(rgba(56,211,245,.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(56,211,245,.05) 1px, transparent 1px),
          radial-gradient(circle at 20% 25%, rgba(167,139,250,.10), transparent 42%),
          radial-gradient(circle at 80% 72%, rgba(56,211,245,.10), transparent 42%);
        background-size: 42px 42px, 42px 42px, 100% 100%, 100% 100%;
      }
      .card {
        max-width: 460px; padding: 40px 32px; border-radius: 20px;
        background: #161F30; border: 1px solid rgba(148,163,184,.16);
        box-shadow: 0 0 40px rgba(56,211,245,.12);
      }
      .logo {
        width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px;
        display: grid; place-items: center; font-weight: 800; font-size: 26px;
        font-family: monospace; color: #38D3F5;
        background: rgba(56,211,245,.12); box-shadow: 0 0 22px rgba(56,211,245,.28);
      }
      h1 { font-size: 26px; letter-spacing: -.5px; margin-bottom: 8px; }
      p { color: #A0B0C4; margin-bottom: 24px; line-height: 1.5; }
      .btn {
        display: inline-block; text-decoration: none; font-weight: 700;
        color: #04160b; padding: 14px 26px; border-radius: 12px;
        background-image: linear-gradient(135deg, #22C55E, #1aa34b);
        box-shadow: 0 6px 18px rgba(34,197,94,.32);
        transition: filter .2s;
      }
      .btn:hover { filter: brightness(1.08); }
      .dim { margin-top: 18px; font-size: 13px; color: #6b7a90; }
      .spin {
        width: 18px; height: 18px; border-radius: 50%; display: inline-block;
        border: 2px solid rgba(56,211,245,.3); border-top-color: #38D3F5;
        animation: s .8s linear infinite; vertical-align: -3px; margin-right: 8px;
      }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">RC</div>
      <h1>RECA Componentes</h1>
      <p>Nossa loja de componentes eletrônicos está de cara nova.<br />Você está sendo redirecionado…</p>
      <a id="ir" class="btn" href="#">Ir para a loja →</a>
      <div class="dim"><span class="spin"></span>Redirecionando automaticamente</div>
    </div>

    <script>
      document.getElementById('ir').href = LOJA;
      setTimeout(function () { window.location.replace(LOJA); }, 1800);
    </script>
  </body>
</html>
